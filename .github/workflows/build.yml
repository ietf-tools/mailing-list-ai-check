name: Build
run-name: Build ${{ github.run_number }} of branch ${{ github.ref_name }} by @${{ github.actor }}

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Get Next Version
        id: semver
        uses: ietf-tools/semver-action@v1
        with:
          token: ${{ github.token }}
          branch: main
          skipInvalidTags: true
          patchList: fix, bugfix, perf, refactor, test, tests, chore

      # __version__ is the single source of truth for the version: pyproject.toml
      # reads it dynamically, /api/docs reports it to the dashboard, and a
      # pipeline run stamps it into the rows it writes. The image is built from
      # the runner's checkout, so writing the computed version here is what puts
      # it inside the image; the edit is not committed back.
      - name: Set the app version
        env:
          VERSION: ${{ steps.semver.outputs.nextStrict }}
        run: |
          set -euo pipefail

          target="src/mailing_list_ai_check/__init__.py"

          # nextStrict is the bare version, without the leading v that `next`
          # carries. Anything else would end up in the image and in the database.
          if ! printf '%s' "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::semver-action produced an unusable version: '${VERSION}'"
            exit 1
          fi

          previous="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' "${target}")"
          if [ -z "${previous}" ]; then
            echo "::error file=${target}::no __version__ assignment found to rewrite"
            exit 1
          fi

          sed -i "s/^__version__ = \".*\"/__version__ = \"${VERSION}\"/" "${target}"

          # Read it back: a sed that matched nothing exits 0, so the substitution
          # has to be confirmed rather than assumed.
          written="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' "${target}")"
          if [ "${written}" != "${VERSION}" ]; then
            echo "::error file=${target}::__version__ is '${written}', expected '${VERSION}'"
            exit 1
          fi
          echo "__version__: ${previous} -> ${written}"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the production image
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          target: prod
          tags: |
            ghcr.io/ietf-tools/mailing-list-ai-check:${{ steps.semver.outputs.nextStrict }}
          platforms: linux/amd64
          push: true

      - name: Create Draft Release
        uses: ncipollo/release-action@v1.21.0
        with:
          prerelease: true
          draft: false
          owner: ietf-tools
          repo: mailing-list-ai-check
          commit: ${{ github.sha }}
          tag: ${{ steps.semver.outputs.nextStrict }}
          name: ${{ steps.semver.outputs.nextStrict }}
          body: '*pending*'
          token: ${{ github.token }}

      - name: Generate CHANGELOG
        id: changelog
        uses: Requarks/changelog-action@v1
        with:
          token: ${{ github.token }}
          fromTag: ${{ steps.semver.outputs.nextStrict }}
          toTag: ${{ steps.semver.outputs.current }}
          writeToFile: false

      - name: Finalize Release
        uses: ncipollo/release-action@v1.21.0
        with:
          allowUpdates: true
          makeLatest: true
          draft: false
          owner: ietf-tools
          repo: mailing-list-ai-check
          tag: ${{ steps.semver.outputs.nextStrict }}
          name: ${{ steps.semver.outputs.nextStrict }}
          body: ${{ steps.changelog.outputs.changes }}
          token: ${{ github.token }}